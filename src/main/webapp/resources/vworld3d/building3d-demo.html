<!--
  WellFAIR 브이월드 WebGL 3D(3.0, Cesium 기반) 연동 시안 — 독립 페이지
  - 열기: run-local.cmd 실행 후  http://localhost:8080/wellfair/resources/vworld3d/building3d-demo.html
  - 브이월드 인증키는 발급 때 등록한 서비스 URL(예: http://localhost:8080)에서만 동작합니다.

  - 층별 색상(위기가구/옥탑·고시원/주거/반지하)은 아직 DB와 연결 안 된 데모 값입니다.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#0b0b0c; --bg-panel:#141416; --bg-card:#1b1b1e; --bg-hover:#26272b;
    --line:#3a3a40; --text:#e2e2e5; --text-2:#9b9ba2; --text-3:#65656c;
    --primary:#448ede; --danger:#e5484d; --warn:#f0b429; --gray:#4a4a50; --blue:#2f6fd6;
    --font:"Noto Sans KR","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden}
  #vmap{position:absolute;inset:0}
  .topbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;
    background:rgba(20,20,22,.92);border-bottom:1px solid var(--line);z-index:20}
  .logo{font-weight:700;letter-spacing:.5px}.logo b{color:var(--primary)}
  .topbar .sub{color:var(--text-2);font-size:13px}
  .topbar .sp{flex:1}
  .btn{background:var(--bg-card);color:var(--text);border:1px solid var(--line);border-radius:2px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .btn:hover{background:var(--bg-hover)} .btn.pri{background:var(--primary);border-color:var(--primary)}
  #status{position:absolute;left:16px;top:64px;z-index:20;background:rgba(20,20,22,.9);border:1px solid var(--line);padding:8px 12px;font-size:12px;color:var(--text-2);max-width:420px}
  #status.err{color:#ff8a8d;border-color:#6b2a2c}

  /* 미니 3D 팝업 */
  #mini{position:absolute;right:16px;bottom:16px;width:300px;height:260px;z-index:20;background:rgba(20,20,22,.95);
    border:1px solid var(--line);display:none;flex-direction:column}
  #mini.on{display:flex}
  #mini .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
  #mini .hd strong{font-size:14px} #mini .meta{font-size:11px;color:var(--text-2);padding:6px 12px 0}
  #mini .cv{flex:1;position:relative}
  .iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg-card);color:var(--text);cursor:pointer;display:grid;place-items:center}
  .iconbtn:hover{background:var(--bg-hover)}
  .iconbtn svg{width:16px;height:16px}

  /* 확대 모달 */
  #modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center}
  #modalBg.on{display:flex}
  #modal{width:min(1000px,94vw);height:min(720px,90vh);background:var(--bg-panel);border:1px solid var(--line);display:flex;flex-direction:column}
  #modal .hd{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
  #modal .hd h2{margin:0;font-size:18px} #modal .hd .meta{color:var(--text-2);font-size:12px;margin-left:12px;font-weight:400}
  #modal .body{flex:1;display:flex;min-height:0}
  #big{flex:1;position:relative}
  #big .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:var(--text-2);font-size:12px;pointer-events:none}
  #big .zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
  #big .zoom button{width:30px;height:30px;background:var(--bg-card);border:1px solid var(--line);color:var(--text);cursor:pointer}
  #legend{width:260px;border-left:1px solid var(--line);padding:16px;overflow:auto}
  #legend h3{font-size:13px;color:var(--text-2);margin:0 0 10px;font-weight:500}
  .fl{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);margin-bottom:8px;background:var(--bg-card);cursor:pointer}
  .fl:hover,.fl.hl{border-color:var(--primary)}
  .sw{width:14px;height:14px;flex:none;margin-top:3px}
  .fl .t{font-weight:500} .fl .d{font-size:12px;color:var(--text-2);margin-top:2px}
  .lab{position:absolute;color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;transform:translate(0,-50%);
    text-shadow:0 1px 2px #000;display:flex;align-items:center;gap:6px}
  .lab:before{content:"";width:40px;height:1px;background:#bbb}
  .props{font-size:11px;color:var(--text-3);margin-top:14px;word-break:break-all;white-space:pre-wrap}
</style>

<!-- ▼ 브이월드 WebGL 3D 3.0 로더 (document.write 를 쓰므로 반드시 head 에서 동기 로드) -->
<!-- 발급받은 인증키(apiKey=...). 실제 서비스 통합 시에는 app.properties 로 옮기세요. -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="vmap"></div>

<div class="topbar">
  <div class="logo">Well<b>FAIR</b></div>
  <div class="sub">3D 건물 입체 분석 시안 · 브이월드 WebGL 3D</div>
  <div class="sp"></div>
  <button class="btn" data-go="guro">구로구</button>
  <button class="btn" data-go="yangcheon">양천구</button>

<div id="mini">
  <div class="hd"><strong>건물 3D 입체보기</strong>
    <div style="display:flex;gap:6px">
      <button class="iconbtn" id="expandBtn" title="확대">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>

<div id="modalBg">

    <div class="hd"><h2>3D 층별 입체 분석<span class="meta" id="modalMeta"></span></h2>
      <button class="iconbtn" id="modalClose">✕</button></div>
    <div class="body">
      <div id="big">
        <div class="hint">마우스 드래그로 360° 회전 · 휠로 확대/축소</div>

    </div>

<script>
/* ===================== 1. 층 데이터 (데모) ===================== */
var CAT = {
  crisis:  {name:"위기가구",     desc:"에너지급감 · 체납 신호", color:0xd8333a, css:"#d8333a"},
  rooftop: {name:"옥탑/고시원",  desc:"비주택 거주 추정",       color:0xf0b429, css:"#f0b429"},
  normal:  {name:"주거",         desc:"일반 주거",              color:0x4a4a50, css:"#4a4a50"},
  base:    {name:"지하층(반지하)",desc:"침수 취약",             color:0x2f6fd6, css:"#2f6fd6"}
};
// 건물 id 로 늘 같은 결과가 나오도록 하는 간이 난수
function seeded(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return function(){h^=h<<13;h^=h>>>17;h^=h<<5;return ((h>>>0)%10000)/10000;};}
function buildFloors(info){
  if(info.preset) return info.preset;
  var r=seeded(info.id||"demo");
  var up=Math.max(1,Math.min(info.floors||(3+Math.floor(r()*3)),12));
  var under=info.under!=null?info.under:(r()<0.75?1:0);
  var list=[];
  for(var b=under;b>=1;b--) list.push({label:"B"+b,cat:"base",idx:-b});
  for(var f=1;f<=up;f++){
    var c="normal";
    if(f===up && up>=3) c=r()<0.5?"crisis":"rooftop";
    else if(f===up-1 && up>=3) c=r()<0.5?"rooftop":"normal";
    else if(r()<0.15) c="crisis";
    list.push({label:f+"F",cat:c,idx:f});
  }
  return list;
}

/* ===================== 2. Three.js 건물 렌더러 ===================== */
function BuildingView(el,opts){
  opts=opts||{};
  var self=this; this.el=el; this.labels=[];
  var w=el.clientWidth||300,h=el.clientHeight||200;
  this.renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  this.renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  this.renderer.setSize(w,h); el.appendChild(this.renderer.domElement);
  this.scene=new THREE.Scene();
  this.camera=new THREE.PerspectiveCamera(35,w/h,0.1,500);
  this.camera.position.set(14,11,16);
  this.scene.add(new THREE.HemisphereLight(0xffffff,0x303040,0.75));
  var d=new THREE.DirectionalLight(0xffffff,0.85); d.position.set(10,20,8); this.scene.add(d);
  var g=new THREE.Mesh(new THREE.CircleGeometry(9,64),new THREE.MeshBasicMaterial({color:0x1b1b1e}));
  g.rotation.x=-Math.PI/2; this.scene.add(g);
  var ring=new THREE.Mesh(new THREE.RingGeometry(7.6,8,96),new THREE.MeshBasicMaterial({color:0x555560,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2; ring.position.y=0.01; this.scene.add(ring);
  this.group=new THREE.Group(); this.scene.add(this.group);
  this.controls=new THREE.OrbitControls(this.camera,this.renderer.domElement);
  this.controls.enableDamping=true; this.controls.enablePan=false;
  this.controls.minDistance=8; this.controls.maxDistance=60;
  this.controls.autoRotate=!!opts.autoRotate; this.controls.autoRotateSpeed=opts.autoRotate?2.2:1;
  this.controls.enabled=opts.interactive!==false;
  this.showLabels=!!opts.labels;
  (function loop(){requestAnimationFrame(loop);self.controls.update();self.renderer.render(self.scene,self.camera);self.updateLabels();})();
  new ResizeObserver(function(){self.resize();}).observe(el);
}
BuildingView.prototype.resize=function(){
  var w=this.el.clientWidth,h=this.el.clientHeight; if(!w||!h) return;
  this.camera.aspect=w/h; this.camera.updateProjectionMatrix(); this.renderer.setSize(w,h);
};
BuildingView.prototype.setFloors=function(floors){
  while(this.group.children.length) this.group.remove(this.group.children[0]);
  this.labels.forEach(function(l){l.el.remove();}); this.labels=[];
  var FH=1.6, W=6, D=4.4, self=this;
  var winMat=new THREE.MeshStandardMaterial({color:0xdfe6ee,roughness:.3,metalness:.1});
  floors.forEach(function(f,i){
    var c=CAT[f.cat];
    var box=new THREE.Mesh(new THREE.BoxGeometry(W,FH*0.96,D),new THREE.MeshStandardMaterial({color:c.color,roughness:.65}));
    var y=i*FH+FH/2; box.position.y=y; box.userData.floor=f; self.group.add(box);
    var edges=new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry),new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.35}));
    edges.position.copy(box.position); self.group.add(edges);
    // 창문 (앞·옆)
    for(var k=0;k<3;k++){
      if(!(f.idx===1&&k===1)){var wm=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.7,0.06),winMat); wm.position.set(-1.8+k*1.8,y+0.05,D/2+0.02); self.group.add(wm);}
      if(k<2){var ws=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.7,0.9),winMat); ws.position.set(W/2+0.02,y+0.05,-0.9+k*1.8); self.group.add(ws);}
    }
    if(self.showLabels) {
      var el=document.createElement("div"); el.className="lab"; el.textContent=f.label+" - "+c.name;
      self.el.appendChild(el); self.labels.push({el:el,pos:new THREE.Vector3(W/2,y,D/2)});
    }
  });
  // 옥상 테두리
  var top=floors.length*FH;
  var roof=new THREE.Mesh(new THREE.BoxGeometry(W*0.92,0.25,D*0.9),new THREE.MeshStandardMaterial({color:CAT[floors[floors.length-1].cat].color,roughness:.8}));
  roof.position.y=top+0.1; this.group.add(roof);
  // 1층(또는 최하층) 출입문
  var door=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.2,0.06),new THREE.MeshStandardMaterial({color:0xcfd3d8}));
  var gi=floors.findIndex(function(f){return f.idx===1;}); door.position.set(0,Math.max(gi,0)*FH+0.6,D/2+0.03); this.group.add(door);
  this.group.position.y=0;
  var mid=top/2; this.controls.target.set(0,mid,0);
  var dist=Math.max(24,top*2.8); this.camera.position.set(dist*0.62,mid+dist*0.4,dist*0.72);
  this.controls.update();
};
BuildingView.prototype.updateLabels=function(){
  if(!this.labels.length) return;
  var w=this.el.clientWidth,h=this.el.clientHeight,cam=this.camera;
  this.labels.forEach(function(l){
    var p=l.pos.clone().project(cam);
    l.el.style.left=((p.x+1)/2*w)+"px"; l.el.style.top=((1-p.y)/2*h)+"px";
    l.el.style.display=p.z<1?"flex":"none";
  });
};
BuildingView.prototype.zoom=function(f){
  var t=this.controls.target, v=this.camera.position.clone().sub(t).multiplyScalar(f);
  var len=Math.min(this.controls.maxDistance,Math.max(this.controls.minDistance,v.length()));
  this.camera.position.copy(t).add(v.setLength(len));
};

/* ===================== 3. 팝업 / 모달 ===================== */
var mini=null, big=null, current=null;
function openBuilding(info){
  current={info:info,floors:buildFloors(info)};
  var meta=(info.name||"선택 건물")+" · 지상 "+current.floors.filter(function(f){return f.idx>0;}).length+"층"
          +(current.floors.some(function(f){return f.idx<0;})?" / 지하 1층":"");
  document.getElementById("miniMeta").textContent=meta;
  document.getElementById("mini").classList.add("on");
  if(!mini) mini=new BuildingView(document.getElementById("miniCv"),{autoRotate:true,interactive:false});
  mini.resize(); mini.setFloors(current.floors);
}
function openModal(){
  if(!current) return;
  document.getElementById("modalBg").classList.add("on");
  if(!big) big=new BuildingView(document.getElementById("big"),{labels:true});
  big.resize(); big.setFloors(current.floors);
  document.getElementById("modalMeta").textContent=document.getElementById("miniMeta").textContent;
  var html=""; current.floors.slice().reverse().forEach(function(f){
    var c=CAT[f.cat];
    html+='<div class="fl"><span class="sw" style="background:'+c.css+'"></span><div><div class="t">'+f.label+' · '+c.name+'</div><div class="d">'+c.desc+'</div></div></div>';
  });
  document.getElementById("floorList").innerHTML=html;
  var p=current.info.props; document.getElementById("props").textContent=p&&Object.keys(p).length?"브이월드 속성\n"+JSON.stringify(p,null,1):"";
}
document.getElementById("expandBtn").onclick=openModal;
document.getElementById("miniClose").onclick=function(){document.getElementById("mini").classList.remove("on");};
document.getElementById("modalClose").onclick=function(){document.getElementById("modalBg").classList.remove("on");};
document.getElementById("modalBg").onclick=function(e){if(e.target.id==="modalBg") this.classList.remove("on");};
document.getElementById("zin").onclick=function(){big&&big.zoom(0.8);};
document.getElementById("zout").onclick=function(){big&&big.zoom(1.25);};
document.getElementById("zrot").onclick=function(){if(big) big.controls.autoRotate=!big.controls.autoRotate;};
document.getElementById("demoBtn").onclick=function(){openBuilding({id:"demo-1",name:"데모 다가구주택",preset:[{label:"B1",cat:"base",idx:-1},{label:"1F",cat:"normal",idx:1},{label:"2F",cat:"rooftop",idx:2},{label:"3F",cat:"crisis",idx:3}]});};
document.addEventListener("keydown",function(e){if(e.key==="Escape") document.getElementById("modalBg").classList.remove("on");});

/* ===================== 4. 브이월드 3D 지도 ===================== */
var GU={ guro:[126.8874,37.4954], yangcheon:[126.8665,37.5170], ydp:[126.8963,37.5264] };
var map3d=null;
function setStatus(t,err){var s=document.getElementById("status");s.textContent=t;s.classList.toggle("err",!!err);}
function viewer(){return window.ws3d&&ws3d.viewer;}
function Ces(){return window.Cesium||(window.ws3d&&ws3d.common);}

function initMap(){
  if(!window.vw){ setStatus("브이월드 스크립트를 불러오지 못했습니다. 인증키의 서비스 URL(localhost:8080) 등록 여부와 인터넷 연결을 확인하세요. '데모 건물 열기'로 모달은 볼 수 있습니다.",true); return; }
  try{
    var cam=new vw.CameraPosition(new vw.CoordZ(126.884,37.488,1400), new vw.Direction(0,-35,0));
    var opt=new vw.MapOptions(vw.BasemapType.GRAPHIC,"",vw.DensityType.FULL,vw.DensityType.BASIC,false,cam,cam);
    map3d=new vw.Map("vmap",opt);
  }catch(e){ setStatus("지도 생성 오류: "+e.message,true); console.error(e); return; }
  var tries=0;
  (function wait(){
    if(viewer()&&viewer().scene){ hookClick(); setStatus("건물을 클릭하면 오른쪽 아래에 3D 입체보기가 뜹니다."); return; }
    if(++tries>100){ setStatus("지도 뷰어를 찾지 못했습니다(ws3d.viewer). 콘솔(F12)을 확인해 주세요.",true); return; }
    setTimeout(wait,200);
  })();
}

// 클릭과 드래그를 구분해서 '클릭'일 때만 건물 선택
function hookClick(){
  var v=viewer(), cv=v.scene.canvas, down=null;
  cv.addEventListener("pointerdown",function(e){down={x:e.clientX,y:e.clientY};});
  cv.addEventListener("pointerup",function(e){
    if(!down) return; var moved=Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y); down=null;
    if(moved>5) return;
    var r=cv.getBoundingClientRect(), C=Ces();
    var pos=C&&C.Cartesian2?new C.Cartesian2(e.clientX-r.left,e.clientY-r.top):{x:e.clientX-r.left,y:e.clientY-r.top};
    var picked=null; try{picked=v.scene.pick(pos);}catch(err){console.warn(err);}
    if(!picked){ return; }
    openBuilding(readFeature(picked,pos));
  });
}

// 클릭한 3D 객체에서 속성·층수를 최대한 읽기 (없으면 높이로 추정)
function readFeature(picked,pos){
  var props={};
  try{
    if(picked.getPropertyIds||picked.getPropertyNames){
      (picked.getPropertyIds?picked.getPropertyIds():picked.getPropertyNames()).forEach(function(k){props[k]=picked.getProperty(k);});
    }else if(picked.id&&picked.id.properties){ props=picked.id.properties.getValue?picked.id.properties.getValue():picked.id.properties; }
  }catch(e){}
  console.log("[3D 선택]",picked,props);
  var floors=null, under=null, height=null, id=null, name=null;
  Object.keys(props).forEach(function(k){
    var K=k.toLowerCase(), val=props[k];
    if(/ugrnd|under|지하/.test(K)) under=parseInt(val,10);
    else if(/grnd|floor|flr|층/.test(K)) floors=parseInt(val,10);
    if(/height|높이|hgt/.test(K)) height=parseFloat(val);
    if(/^id$|model|name|bld|건물/.test(K)&&!id) id=String(val);
    if(/name|명칭|bldnm/.test(K)) name=String(val);
  });
  if(!floors&&height) floors=Math.round(height/3);
  // 속성이 없으면 클릭 지점 높이로 대략 추정
  if(!floors){
    try{ var v=viewer(), cart=v.scene.pickPosition(pos);
      if(cart){ var g=v.scene.globe.ellipsoid.cartesianToCartographic(cart); var gh=v.scene.globe.getHeight(g)||0;
        floors=Math.max(1,Math.round((g.height-gh)/3)+1); id=id||(g.longitude.toFixed(6)+","+g.latitude.toFixed(6)); }
    }catch(e){}
  }
  return {id:id||String(Math.random()),name:name,floors:floors,under:isNaN(under)?null:under,props:props};
}

function flyTo(key){
  var p=GU[key], v=viewer(), C=Ces();
  try{
    if(v&&C&&C.Cartesian3){ v.camera.flyTo({destination:C.Cartesian3.fromDegrees(p[0],p[1]-0.012,1100),orientation:{heading:0,pitch:C.Math.toRadians(-35),roll:0}}); return; }
    if(map3d&&map3d.moveTo){ map3d.moveTo(new vw.CameraPosition(new vw.CoordZ(p[0],p[1],1200),new vw.Direction(0,-35,0))); }
  }catch(e){console.warn(e);}
}
document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){flyTo(b.dataset.go);};});

window.addEventListener("load",initMap);
</script>
